<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="140" height="140">
  <defs>
    <path id="stampTopCurve" d="M 30,100 A 70,70 0 0,1 170,100" />
    <path id="stampBottomCurve" d="M 170,100 A 70,70 0 0,1 30,100" />
  </defs>
  
  <g stroke="#561318" fill="none">
    <!-- Outer Rings -->
    <circle cx="100" cy="100" r="92" stroke-width="3" />
    <circle cx="100" cy="100" r="85" stroke-width="1.2" stroke-dasharray="3, 2" />
    <circle cx="100" cy="100" r="62" stroke-width="1.5" />
    <circle cx="100" cy="100" r="56" stroke-width="1" />
  </g>

  <!-- Circular Texts -->
  <text font-family="'Outfit', 'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#561318" letter-spacing="3.2">
    <textPath href="#stampTopCurve" startOffset="50%" text-anchor="middle">
      BE CREATIVES
    </textPath>
  </text>
  
  <text font-family="'Outfit', 'Inter', sans-serif" font-size="6.8" font-weight="800" fill="#561318" letter-spacing="1.2">
    <textPath href="#stampBottomCurve" startOffset="50%" text-anchor="middle">
      INNOVATIVE SOLUTIONS, LIMITLESS POSSIBILITIES
    </textPath>
  </text>

  <!-- Center Maroon Circle with White BE CREATIVES Mark -->
  <circle cx="100" cy="100" r="50" fill="#561318" />
  <g fill="#ffffff" transform="translate(100, 100) scale(0.68) translate(-65, -55)">
    <!-- Stylized 'be' lowercase mark -->
    <path d="M 30,68 C 18,68 10,58 10,44 C 10,30 20,20 32,20 C 44,20 52,28 54,38 L 40,38 C 39,32 35,28 30,28 C 24,28 20,33 20,44 C 20,54 24,60 31,60 C 36,60 40,56 41,50 L 55,50 C 53,61 44,68 30,68 Z" />
    <circle cx="32" cy="10" r="5" />
    <!-- 'e' letter connected -->
    <path d="M 85,46 C 85,32 75,20 60,20 C 45,20 36,32 36,46 C 36,60 46,70 61,70 C 73,70 82,62 84,51 L 70,51 C 69,56 65,60 60,60 C 54,60 50,54 50,46 L 85,46 Z M 50,40 C 51,33 55,29 60,29 C 65,29 69,33 70,40 L 50,40 Z" />
    <!-- CREATIVES text below -->
    <text x="50" y="85" font-family="'Outfit', sans-serif" font-size="14.5" font-weight="900" text-anchor="middle" letter-spacing="3.5" fill="#ffffff">CREATIVES</text>
  </g>
</svg>
